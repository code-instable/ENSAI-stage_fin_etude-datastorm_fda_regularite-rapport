# Hayagriva bibliography, converted from src/bibliography/main.bib with the
# `tohaya` converter (crates.io, built on the official `hayagriva` crate) and
# manually audited against the source .bib. Citation keys are preserved
# verbatim from the BibTeX source. Corrections applied during the audit are
# documented in the final report; in summary:
#  - VAR_paper: the source author field "James H. Stock \& Mark W. Watson"
#    uses "\&" instead of BibTeX's "and" separator, so BibTeX/tohaya parsed
#    it as a single garbled person name. Restored as two authors (a real,
#    identifiable 2001 JEP paper by Stock and Watson).
#  - maissoro-SmoothnessFTSweakDep: the source author field
#    "Maissoro, Vimond, Patilea" (commas, no "and") was likewise parsed as
#    one malformed name. Restored as three authors, surnames only, in the
#    order given (no given names appear in this specific record).
#  - muller2005generalized / chen2011single: the source has no `journal`
#    field; the empty `parent: periodical` produced by conversion was
#    dropped rather than left dangling.
#  - HsingEubankTheoreticalFoundationsOfFDA: the source has an empty
#    `editor = {}`; dropped rather than kept as an empty field.
#  - gourdon2020maths-dense-non-deriv: `pages = {398—399 , ex4 : 401}` is
#    prose, not a numeric range, and is already repeated in `note`; kept
#    only in `note` instead of an invalid `page-range`.
#  - estimation-dependent-strong-mixing: source has both `date = {2020/10/01}`
#    and `year = {2020}`; the more precise `date` is used. Source `isbn =
#    {1572-9311}` is an ISSN-shaped value (plain BibTeX has no `issn` field,
#    so authors conventionally overload `isbn`); recorded as `issn`. Its
#    abstract contained a mangled copy-paste artifact
#    ("{\$}{\$}{}$\backslash${} alpha {\$}{\$}-mixing"); normalized to the
#    unambiguous "α-mixing" it was clearly meant to render as.
#  - Protected-capitalization braces (`{é}`, `{É}`, `{Weakly dependent...}`)
#    and literal `\href{}{}` / `\og`/`\fg` / `\colorize{}` LaTeX markup left
#    over in `note`/title/organization fields were expanded to plain text.
#  - arXiv `primaryclass` (no direct Hayagriva field) kept as a short note.
#  - `weakly-dependent-functional-data` and `10.1214/09-AOS768` are the same
#    paper under two different citation keys, both actually used with
#    `\cite` in the report; both are kept as separate entries, unmodified,
#    exactly as in the source .bib.

